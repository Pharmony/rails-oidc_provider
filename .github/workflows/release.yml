# Publishes rails-oidc_provider to RubyGems and creates a GitHub Release when a
# version tag is pushed. Release notes are the matching section from CHANGELOG.md.
#
# Setup (one-time):
#   1. Create the gem on rubygems.org (or push once manually).
#   2. Enable Trusted Publishing for this GitHub repo + workflow:
#      https://guides.rubygems.org/trusted-publishing/
#      - Repository: Pharmony/rails-oidc_provider
#      - Workflow: release.yml
#      - Environment: (leave empty unless you add `environment:` below)
#   3. Tag and push: bin/release   # or: git tag v1.0.0 && git push origin v1.0.0
#
# The tag must match lib/rails_oidc_provider/version.rb (e.g. v1.0.0 → 1.0.0).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create GitHub Release + upload assets
  id-token: write # RubyGems trusted publishing (OIDC)

jobs:
  publish:
    name: Publish gem and GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Verify tag matches gem VERSION
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          expected="${tag#v}"
          actual="$(ruby -e "require_relative 'lib/rails_oidc_provider/version'; puts RailsOidcProvider::VERSION")"
          echo "tag=${tag}"
          echo "version=${actual}"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::Tag ${tag} does not match RailsOidcProvider::VERSION (${actual}). Update version.rb or retag."
            exit 1
          fi
          echo "version=${actual}" >> "${GITHUB_OUTPUT}"

      - name: Extract CHANGELOG section for this version
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/release-notes.md"
          # Keep a Changelog sections look like:
          #   ## [1.0.0] - 2026-03-26
          #   ...body...
          #   ## [Unreleased] or ## [0.9.0] ...
          ruby <<'RUBY' > "${notes_file}"
          version = ENV.fetch("VERSION")
          lines = File.readlines("CHANGELOG.md", chomp: true)
          start_idx = lines.index { |l| l.match?(/\A## \[#{Regexp.escape(version)}\]/) }
          unless start_idx
            warn "No CHANGELOG section for #{version}; using fallback notes."
            puts "Release #{version} of rails-oidc_provider."
            puts
            puts "See CHANGELOG.md for details."
            exit 0
          end
          stop_idx = (start_idx + 1...lines.length).find { |i| lines[i].start_with?("## ") }
          stop_idx ||= lines.length
          body = lines[(start_idx + 1)...stop_idx]
          # Drop leading/trailing blank lines
          body.shift while body.first&.empty?
          body.pop while body.last&.empty?
          if body.empty?
            puts "Release #{version} of rails-oidc_provider."
          else
            puts body.join("\n")
          end
          RUBY
          echo "path=${notes_file}" >> "${GITHUB_OUTPUT}"
          echo "----- release notes preview -----"
          cat "${notes_file}"
          echo "---------------------------------"

      - name: Build gem
        run: bundle exec rake build

      - name: Publish gem to RubyGems.org
        uses: rubygems/release-gem@v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.changelog.outputs.path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gem_file="pkg/rails-oidc_provider-${VERSION}.gem"
          if [ ! -f "${gem_file}" ]; then
            # rake build may write a slightly different path; pick the built gem
            gem_file="$(ls -1 pkg/rails-oidc_provider-*.gem | head -n 1)"
          fi
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file "${NOTES_FILE}" \
            "${gem_file}"
