# Usage:
#   docker compose build test
#   docker compose run --rm test
#   docker compose run --rm test bundle exec rubocop
#
# Pick a matrix pair without clashing with host rbenv/asdf RUBY_VERSION:
#   MATRIX_RUBY=3.2 MATRIX_RAILS=7.2 docker compose build test
#   MATRIX_RUBY=3.2 MATRIX_RAILS=7.2 docker compose run --rm test
services:
  test:
    build:
      context: .
      args:
        # Do not use ${RUBY_VERSION} — hosts often export rbenv values like "ruby-3.4.4".
        RUBY_VERSION: ${MATRIX_RUBY:-3.3}
        RAILS_VERSION: ${MATRIX_RAILS:-7.1}
    image: rails-oidc_provider-test:${MATRIX_RUBY:-3.3}-rails${MATRIX_RAILS:-7.1}
    environment:
      RAILS_ENV: test
      APP_HOST: www.example.com
      OIDC_PROVIDER_KEY_PASSPHRASE: test-passphrase
      RAILS_VERSION: ${MATRIX_RAILS:-7.1}
    # Do not mount the whole tree by default: the image already has gems installed
    # for the chosen Rails line. Mount when iterating on code:
    #   docker compose run --rm -v "$PWD:/app" test
    command: bundle exec rspec
